<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b9b8f" />
  <title>Nour · Care Companion</title>
  <meta name="description" content="A gentle, shared day-to-day care companion." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" />

  <style>
    :root {
      --bg:#eef5f2; --bg2:#e3efea; --card:#ffffff;
      --ink:#243330; --muted:#64756f; --faint:#8a9a94;
      --teal:#3b9b8f; --teal-deep:#2f7d73; --teal-soft:#d9efe9;
      --rose:#e07a93; --rose-soft:#fbe6ec;
      --amber:#d9922f; --amber-soft:#fbeccf;
      --danger:#d64a4a; --danger-soft:#fbe0e0;
      --line:rgba(20,50,45,0.10);
      --shadow:0 8px 26px rgba(40,90,80,0.10);
      --radius:18px;
      --fi:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      --fa:"Tajawal","Inter",system-ui,sans-serif;
      --font:var(--fi);
    }
    html[lang="ar"]{ --font:var(--fa); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; }
    body{
      font-family:var(--font);
      background:linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--ink);
      line-height:1.5; font-size:16px;
      min-height:100vh;
      padding-bottom:84px; /* bottom nav */
      -webkit-font-smoothing:antialiased;
    }
    h1,h2,h3{ margin:0; font-weight:600; }
    button{ font-family:inherit; cursor:pointer; }
    input,select,textarea{ font-family:inherit; font-size:16px; }
    .hidden{ display:none !important; }

    /* ---------- header ---------- */
    header.app{
      position:sticky; top:0; z-index:30;
      background:var(--teal);
      color:#fff;
      padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
      display:flex; align-items:center; gap:10px;
      box-shadow:0 2px 14px rgba(40,90,80,0.18);
    }
    header.app .title{ font-size:1.12rem; font-weight:700; display:flex; align-items:center; gap:8px; }
    header.app .spacer{ flex:1; }
    header.app .pill{
      background:rgba(255,255,255,0.18); color:#fff; border:none;
      padding:7px 11px; border-radius:999px; font-size:0.82rem; font-weight:600;
      display:inline-flex; align-items:center; gap:6px;
    }
    header.app .pill:hover{ background:rgba(255,255,255,0.28); }
    .sync-dot{ width:9px; height:9px; border-radius:50%; background:#cfe8e2; display:inline-block; }
    .sync-dot.on{ background:#8ff0c8; box-shadow:0 0 0 3px rgba(143,240,200,0.3); }
    .sync-dot.off{ background:#f3c27a; }

    /* ---------- layout ---------- */
    main{ width:min(720px,100%); margin:0 auto; padding:16px 14px 24px; }
    .view{ animation:fade .35s ease; }
    @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

    .card{
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
      border:1px solid var(--line);
    }
    .card h2{ font-size:1.05rem; display:flex; align-items:center; gap:9px; margin-bottom:4px; }
    .card .sub{ color:var(--muted); font-size:0.86rem; margin:2px 0 12px; }
    .section-label{ font-size:0.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:18px 4px 8px; }

    /* disclaimer / emergency */
    .notice{
      background:var(--amber-soft); border:1px solid #efd49a; color:#6d4e16;
      border-radius:14px; padding:11px 13px; font-size:0.84rem; margin-bottom:14px;
      display:flex; gap:9px; align-items:flex-start;
    }
    .notice.danger{ background:var(--danger-soft); border-color:#f0b4b4; color:#8a2b2b; }
    .notice b{ font-weight:700; }

    /* buttons */
    .btn{ border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:0.95rem; background:var(--teal); color:#fff; }
    .btn:active{ transform:translateY(1px); }
    .btn.block{ display:block; width:100%; }
    .btn.ghost{ background:var(--teal-soft); color:var(--teal-deep); }
    .btn.soft{ background:#eef2f1; color:var(--ink); }
    .btn.rose{ background:var(--rose); }
    .btn.sm{ padding:8px 12px; font-size:0.85rem; border-radius:10px; }
    .btn.danger{ background:var(--danger-soft); color:#8a2b2b; }

    /* form fields */
    label.field{ display:block; margin-bottom:12px; }
    label.field > span{ display:block; font-size:0.82rem; color:var(--muted); margin-bottom:5px; font-weight:600; }
    input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
      width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 13px; background:#fbfdfc; color:var(--ink);
    }
    textarea{ resize:vertical; min-height:70px; }
    .row{ display:flex; gap:10px; }
    .row > *{ flex:1; }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; }
    .chip{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font-size:0.86rem; color:var(--muted); }
    .chip.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
    .chip.rose.on{ background:var(--rose); border-color:var(--rose); }

    /* checklist */
    .task{ display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--line); }
    .task:last-child{ border-bottom:none; }
    .task .box{ width:28px; height:28px; border-radius:9px; border:2px solid var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto; font-size:16px; background:#fff; }
    .task.done .box{ background:var(--teal); }
    .task .ic{ font-size:1.25rem; flex:0 0 auto; }
    .task .lbl{ flex:1; font-weight:500; }
    .task.done .lbl{ color:var(--faint); text-decoration:line-through; }
    .task .who{ font-size:0.7rem; color:var(--faint); }

    /* water */
    .water{ display:flex; align-items:center; gap:16px; }
    .water .ring{ --p:0; width:92px; height:92px; border-radius:50%; flex:0 0 auto;
      background:conic-gradient(var(--teal) calc(var(--p)*1%), #e4efec 0);
      display:flex; align-items:center; justify-content:center; }
    .water .ring .inner{ width:74px; height:74px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .water .ring .inner b{ font-size:1.3rem; color:var(--teal-deep); }
    .water .ring .inner small{ color:var(--faint); font-size:0.7rem; }
    .water .ctrls{ flex:1; }
    .round{ width:52px; height:52px; border-radius:50%; border:none; font-size:1.6rem; font-weight:700; }
    .round.plus{ background:var(--teal); color:#fff; }
    .round.minus{ background:#eef2f1; color:var(--muted); }

    /* glance grid */
    .glance{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .glance .g{ background:var(--teal-soft); border-radius:14px; padding:12px; }
    .glance .g .k{ font-size:0.74rem; color:var(--teal-deep); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .glance .g .v{ font-size:1.15rem; font-weight:700; margin-top:3px; }
    .glance .g .v small{ font-weight:500; color:var(--muted); font-size:0.78rem; }

    /* list items */
    .item{ border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:9px; background:#fdfefe; }
    .item .top{ display:flex; align-items:center; gap:8px; }
    .item .top .name{ font-weight:600; flex:1; }
    .item .meta{ font-size:0.8rem; color:var(--muted); margin-top:3px; }
    .item .del{ background:none; border:none; color:var(--faint); font-size:1.1rem; padding:2px 6px; }
    .tag{ font-size:0.72rem; padding:2px 8px; border-radius:999px; background:#eef2f1; color:var(--muted); font-weight:600; }
    .tag.nour{ background:var(--rose-soft); color:#b24c64; }
    .tag.partner{ background:var(--teal-soft); color:var(--teal-deep); }

    .empty{ color:var(--faint); font-size:0.88rem; text-align:center; padding:14px; }

    /* bottom nav */
    nav.tabs{
      position:fixed; bottom:0; left:0; right:0; z-index:40;
      background:#fff; border-top:1px solid var(--line);
      display:flex; padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
      box-shadow:0 -4px 20px rgba(40,90,80,0.08);
    }
    nav.tabs button{ flex:1; background:none; border:none; color:var(--faint); padding:7px 2px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:0.68rem; font-weight:600; }
    nav.tabs button .ti{ font-size:1.35rem; line-height:1; }
    nav.tabs button.on{ color:var(--teal-deep); }
    nav.tabs button.on .ti{ transform:translateY(-1px); }

    /* onboarding / modal */
    .scrim{ position:fixed; inset:0; background:rgba(20,40,36,0.5); z-index:60; display:flex; align-items:center; justify-content:center; padding:18px; }
    .sheet{ background:#fff; border-radius:22px; width:min(460px,100%); max-height:92vh; overflow:auto; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .sheet h2{ font-size:1.2rem; margin-bottom:6px; }
    .sheet .lead{ color:var(--muted); font-size:0.9rem; margin-bottom:16px; }
    .choice{ display:flex; gap:10px; }
    .choice button{ flex:1; border:2px solid var(--line); background:#fbfdfc; border-radius:14px; padding:14px; font-weight:700; color:var(--ink); }
    .choice button.on{ border-color:var(--teal); background:var(--teal-soft); color:var(--teal-deep); }

    .toast{ position:fixed; bottom:94px; left:50%; transform:translateX(-50%) translateY(18px); background:#243330; color:#fff; padding:10px 18px; border-radius:999px; font-size:0.88rem; opacity:0; transition:opacity .3s, transform .3s; z-index:80; box-shadow:var(--shadow); max-width:90vw; text-align:center; }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    .heart{ color:var(--rose); }
    a.tel{ color:var(--teal-deep); font-weight:700; text-decoration:none; }
    .muted{ color:var(--muted); }
    .center{ text-align:center; }
    .small{ font-size:0.82rem; }
  </style>
</head>

    var sync={ ok:false, busy:false, lastPull:0 };
    function syncHeaders(){ return { "Content-Type":"application/json", "apikey":SUPA.anon, "Authorization":"Bearer "+SUPA.anon }; }
    function syncEndpoint(){ return SUPA.url+"/functions/v1/"+SUPA.fn; }
    function canSync(){ return !!(state.config.spaceCode); }

    function syncCall(body){
      return fetch(syncEndpoint(),{ method:"POST", headers:syncHeaders(), body:JSON.stringify(body) })
        .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); });
    }
    function setSync(on){ sync.ok=on; var d=document.getElementById("syncDot"); if(d){ d.className="sync-dot "+(on?"on":"off"); } }

    function pushConfig(){
      if(!canSync()) return;
      state.config.updatedAt=Date.now();

        .then(function(){ setSync(true); }).catch(function(){ setSync(false); });
    }
    function pushEntry(e){
      if(!canSync()) return;
      syncCall({action:"push",space:state.config.spaceCode,entries:[e]})
        .then(function(){ setSync(true); }).catch(function(){ setSync(false); });
    }
    function pushCheck(day,taskId,obj){
      if(!canSync()) return;
      syncCall({action:"push",space:state.config.spaceCode,checklist:[{day:day,task_id:taskId,done:obj.done,author:obj.author,at:obj.at}]})
        .then(function(){ setSync(true); }).catch(function(){ setSync(false); });
    }
    function pull(){
      if(!canSync()||sync.busy) return Promise.resolve();
      sync.busy=true;
      return syncCall({action:"pull",space:state.config.spaceCode}).then(function(res){
        setSync(true); sync.busy=false; sync.lastPull=Date.now();
        var changed=false;
        // config: last-write-wins
        if(res.config && (res.config.updatedAt||0) > (state.config.updatedAt||0)){
          var lang=state.config.lang, role=state.config.role; // keep this device's view prefs
          state.config=Object.assign(state.config,res.config);
          state.config.lang=lang; state.config.role=role;
          changed=true;
        }
        // entries: merge by id
        if(res.entries){
          var byId={}; state.entries.forEach(function(e){ byId[e.id]=e; });
          res.entries.forEach(function(e){
            if(!byId[e.id] || (e.updatedAt||0)>(byId[e.id].updatedAt||0)){ byId[e.id]=e; changed=true; }
          });
          state.entries=Object.keys(byId).map(function(k){ return byId[k]; });
        }
        // checklist: merge by (day,task) LWW
        if(res.checklist){
          res.checklist.forEach(function(c){
            state.checklist[c.day]=state.checklist[c.day]||{};
            var cur=state.checklist[c.day][c.task_id];
            if(!cur || (c.at||0)>(cur.at||0)){ state.checklist[c.day][c.task_id]={done:c.done,author:c.author,at:c.at}; changed=true; }
          });
        }
        if(changed){ save(); render(); }
      }).catch(function(){ setSync(false); sync.busy=false; });
    }

      });
      syncCall({action:"push",space:state.config.spaceCode,config:state.config,entries:state.entries,checklist:checklist})
        .then(function(){ setSync(true); }).catch(function(){ setSync(false); });
    }

        +'<button class="btn ghost block" id="apAdd">'+t("add")+'</button>');

      var notes=entriesOf("note").slice(0,40);
      var noteList=notes.length?notes.map(function(e){
        return '<div class="item"><div class="top"><span class="tag '+e.author+'">'+esc(nameOf(e.author))+'</span><span class="name" style="font-weight:500">'+esc(e.data.text)+'</span><button class="del" data-del="'+e.id+'">✕</button></div><div class="meta">'+fmtWhen(e.createdAt)+'</div></div>';
      }).join(""):'<div class="empty">'+t("no_notes")+'</div>';
      var notesCard=card('<h2>💬 <span>'+t("notes")+'</span></h2><div class="sub">'+t("notes_sub")+'</div>'
        +'<div class="row"><input type="text" id="noteText" data-i18n-ph="write_note"><button class="btn rose" id="noteAdd">'+t("add")+'</button></div>'
        +'<div style="margin-top:12px">'+noteList+'</div>');

      return '<div class="view">'+medsCard+apptCard+notesCard+'</div>';
    };

    /* ---------- MORE / settings ---------- */
    views.more=function(){
      var c=state.config;
      var names=card('<h2>👤 <span>'+t("names")+'</span></h2>'
        +'<div class="row"><label class="field"><span>'+t("her_name")+'</span><input type="text" id="nName" value="'+esc(c.names.nour)+'"></label>'
        +'<label class="field"><span>'+t("your_name")+'</span><input type="text" id="pName" value="'+esc(c.names.partner)+'"></label></div>'
        +'<div class="row"><label class="field"><span>'+t("water_goal")+'</span><input type="number" id="sGoal" value="'+c.waterGoal+'"></label>'
        +'<label class="field"><span>'+t("fever_thr")+'</span><input type="number" step="0.1" id="sFever" value="'+c.feverC+'"></label></div>'
        +'<button class="btn block" id="saveNames">'+t("save")+'</button>');

      var em=c.emergency||{};
      var emerg=card('<h2>⛑️ <span>'+t("emergency")+'</span></h2>'
        +'<label class="field"><span>'+t("doctor")+'</span><input type="text" id="eDoc" value="'+esc(em.doctor)+'"></label>'
        +'<div class="row"><label class="field"><span>'+t("phone")+'</span><input type="text" inputmode="tel" id="ePhone" value="'+esc(em.phone)+'"></label>'
        +'<label class="field"><span>'+t("hospital")+'</span><input type="text" id="eHosp" value="'+esc(em.hospital)+'"></label></div>'
        +'<label class="field"><span>'+t("note")+'</span><textarea id="eNotes">'+esc(em.notes)+'</textarea></label>'
        +'<button class="btn block" id="saveEmerg">'+t("save")+'</button>');

      var tasks=c.checklistTemplate.map(function(tk,i){
        var lbl=state.config.lang==="ar"?(tk.ar||tk.en):(tk.en||tk.ar);
        return '<div class="item"><div class="top"><span class="name">'+(tk.icon||"•")+' '+esc(lbl)+'</span><button class="del" data-deltask="'+tk.id+'">✕</button></div></div>';
      }).join("");
      var cl=card('<h2>✅ <span>'+t("edit_checklist")+'</span></h2>'+tasks
        +'<div class="row"><input type="text" id="taskNew" data-i18n-ph="add_task"><button class="btn ghost" id="taskAdd">'+t("add")+'</button></div>');

      var space=card('<h2>🔗 <span>'+t("space")+'</span></h2><div class="sub">'+t("space_sub")+'</div>'
        +'<div class="row"><input type="text" id="spaceCode" value="'+esc(c.spaceCode||"")+'" readonly style="font-weight:700;letter-spacing:.08em;text-align:center">'
        +'<button class="btn soft" id="copyCode">'+t("copy")+'</button></div>');

      var lang=card('<h2>🌐 <span>'+t("onb_lang")+'</span></h2><div class="choice"><button class="'+(c.lang==="ar"?"on":"")+'" data-lang="ar">العربية</button><button class="'+(c.lang==="en"?"on":"")+'" data-lang="en">English</button></div>');

      var about=card('<h2>ℹ️ <span>'+t("about")+'</span></h2><div class="small muted">'+t("disclaimer")+'</div>'
        +'<button class="btn danger block" id="resetBtn" style="margin-top:14px">'+t("reset")+'</button>');

      return '<div class="view">'+lang+names+emerg+cl+space+about+'</div>';
    };

    function fmtWhen(ts){ var d=new Date(ts); return d.toLocaleString(state.config.lang==="ar"?"ar":"en",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"}); }
    function fmtDateTime(s){ try{ return new Date(s).toLocaleString(state.config.lang==="ar"?"ar":"en",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return s; } }

    /* ============================ bindings ============================ */
    var bind={};
    function chipGroup(containerId,attr,multi,onchange){
      var cont=document.getElementById(containerId); if(!cont) return;
      cont.querySelectorAll(".chip").forEach(function(ch){
        ch.addEventListener("click",function(){
          if(multi){ ch.classList.toggle("on"); }
          else { cont.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); }
          onchange&&onchange();
        });
      });
    }
    function selected(containerId,attr,multi){
      var cont=document.getElementById(containerId); if(!cont) return multi?[]:null;
      var on=cont.querySelectorAll(".chip.on");
      if(multi) return Array.prototype.map.call(on,function(c){return c.getAttribute(attr);});
      return on.length?on[0].getAttribute(attr):null;
    }
    function waterBtns(){
      var p=document.getElementById("wPlus"), m=document.getElementById("wMinus");
      if(p) p.addEventListener("click",function(){ addEntry("water",{delta:1}); render(); });
      if(m) m.addEventListener("click",function(){ if(waterCount(todayStr())>0){ addEntry("water",{delta:-1}); render(); } });
    }
    function delButtons(){
      document.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click",function(){ delEntry(b.getAttribute("data-del")); }); });
    }

    bind.today=function(){
      document.querySelectorAll(".task").forEach(function(row){
        row.addEventListener("click",function(){
          var id=row.getAttribute("data-task"); var day=todayStr();
          state.checklist[day]=state.checklist[day]||{};
          var cur=state.checklist[day][id]||{done:false};
          var obj={done:!cur.done,author:who(),at:Date.now()};
          state.checklist[day][id]=obj; save(); pushCheck(day,id,obj); render();
        });
      });
      waterBtns();
      chipGroup("qMood","data-m",false);
      document.getElementById("qSave").addEventListener("click",function(){
        var mood=selected("qMood","data-m",false);
        var data={};
        if(mood!=null) data.mood=parseInt(mood,10);
        var en=document.getElementById("qEnergy").value; if(en) data.energy=parseInt(en,10);
        var tp=document.getElementById("qTemp").value; if(tp) data.temp=parseFloat(tp);
        if(Object.keys(data).length===0){ toast(t("none_yet")); return; }
        var e=addEntry("vital",data); feverCheck(data.temp); toast(t("saved")); render();
      });
    };

    bind.health=function(){
      chipGroup("hMood","data-m",false); chipGroup("hApp","data-a",false); chipGroup("hSym","data-s",true);
      delButtons();
      document.getElementById("hSave").addEventListener("click",function(){
        var data={};
        var tp=val("hTemp"); if(tp) data.temp=parseFloat(tp);
        var w=val("hWeight"); if(w) data.weight=parseFloat(w);
        var mood=selected("hMood","data-m",false); if(mood!=null) data.mood=parseInt(mood,10);
        var en=val("hEnergy"); if(en) data.energy=parseInt(en,10);
        var sl=val("hSleep"); if(sl) data.sleep=parseFloat(sl);
        var pn=val("hPain"); if(pn!=="") data.pain=parseInt(pn,10);
        var ap=selected("hApp","data-a",false); if(ap) data.appetite=ap;
        var sym=selected("hSym","data-s",true); if(sym.length) data.symptoms=sym;
        var nt=val("hNote"); if(nt) data.note=nt;
        if(Object.keys(data).length===0){ toast(t("none_yet")); return; }
        addEntry("vital",data); feverCheck(data.temp); toast(t("saved")); render();
      });
    };

    bind.food=function(){
      waterBtns(); delButtons();
      document.getElementById("dietSave").addEventListener("click",function(){
        state.config.dietary[state.config.lang]=document.getElementById("dietary").value;
        save(); pushConfig(); toast(t("saved"));
      });
      chipGroup("mealFelt","data-f",false);
      document.getElementById("mealSave").addEventListener("click",function(){
        var what=val("mealWhat"); if(!what){ return; }
        addEntry("meal",{what:what,felt:selected("mealFelt","data-f",false)}); toast(t("saved")); render();
      });
    };

    bind.care=function(){
      delButtons();
      document.querySelectorAll("[data-delmed]").forEach(function(b){ b.addEventListener("click",function(){ state.config.meds=state.config.meds.filter(function(m){return m.id!==b.getAttribute("data-delmed");}); save(); pushConfig(); render(); }); });
      document.querySelectorAll("[data-delappt]").forEach(function(b){ b.addEventListener("click",function(){ state.config.appointments=state.config.appointments.filter(function(a){return a.id!==b.getAttribute("data-delappt");}); save(); pushConfig(); render(); }); });
      document.getElementById("medAdd").addEventListener("click",function(){
        var name=val("medName"); if(!name) return;
        state.config.meds.push({id:uuid(),name:name,dose:val("medDose"),time:val("medTime"),notes:""}); save(); pushConfig(); render();
      });
      document.getElementById("apAdd").addEventListener("click",function(){
        var title=val("apTitle"), when=val("apWhen"); if(!title||!when) return;
        state.config.appointments.push({id:uuid(),title:title,when:when,where:val("apWhere")}); save(); pushConfig(); render();
      });
      document.getElementById("noteAdd").addEventListener("click",function(){
        var txt=val("noteText"); if(!txt) return; addEntry("note",{text:txt}); render();
      });
    };

    bind.more=function(){
      document.querySelectorAll("[data-deltask]").forEach(function(b){ b.addEventListener("click",function(){ state.config.checklistTemplate=state.config.checklistTemplate.filter(function(x){return x.id!==b.getAttribute("data-deltask");}); save(); pushConfig(); render(); }); });
      document.querySelectorAll("[data-lang]").forEach(function(b){ b.addEventListener("click",function(){ state.config.lang=b.getAttribute("data-lang"); save(); render(); }); });
      document.getElementById("saveNames").addEventListener("click",function(){
        state.config.names.nour=val("nName")||"Nour"; state.config.names.partner=val("pName");
        state.config.waterGoal=Math.max(1,parseInt(val("sGoal"),10)||8);
        state.config.feverC=parseFloat(val("sFever"))||38;
        save(); pushConfig(); toast(t("saved")); render();
      });
      document.getElementById("saveEmerg").addEventListener("click",function(){
        state.config.emergency={doctor:val("eDoc"),phone:val("ePhone"),hospital:val("eHosp"),notes:val("eNotes")};
        save(); pushConfig(); toast(t("saved"));
      });
      document.getElementById("taskAdd").addEventListener("click",function(){
        var lbl=val("taskNew"); if(!lbl) return;
        state.config.checklistTemplate.push({id:uuid(),en:lbl,ar:lbl,icon:"•"}); save(); pushConfig(); render();
      });
      document.getElementById("copyCode").addEventListener("click",function(){
        var code=state.config.spaceCode||""; navigator.clipboard&&navigator.clipboard.writeText(code); toast(t("copied"));
      });
      document.getElementById("resetBtn").addEventListener("click",function(){
        if(confirm(state.config.lang==="ar"?"هل تريد تصفير هذا الجهاز؟ البيانات المتزامنة تبقى في المساحة المشتركة.":"Reset this device? Synced data stays in the shared space.")){
          localStorage.removeItem(LS_KEY); location.reload();
        }
      });
    };

    function val(id){ var el=document.getElementById(id); return el?el.value.trim():""; }
    function feverCheck(temp){
      if(temp && temp>=(state.config.feverC||38)){
        var em=state.config.emergency||{};
        var box=document.createElement("div"); box.className="scrim"; box.style.zIndex=90;
        box.innerHTML='<div class="sheet"><h2 style="color:var(--danger)">🌡️ '+(state.config.lang==="ar"?"حرارة مرتفعة":"High temperature")+' ('+temp+'°)</h2>'
          +'<div class="notice danger" style="margin-top:10px">⚠️ <div>'+t("fever_warn")+'</div></div>'
          +(em.phone?'<a class="btn block rose" href="tel:'+esc(em.phone)+'">📞 '+t("call")+' '+esc(em.doctor||em.phone)+'</a>':'')
          +'<button class="btn soft block" id="feverOk" style="margin-top:10px">'+t("done")+'</button></div>';
        document.body.appendChild(box);
        box.querySelector("#feverOk").addEventListener("click",function(){ box.remove(); });
      }
    }

    /* ============================ emergency sheet ============================ */
    document.getElementById("emergencyBtn").addEventListener("click",function(){
      var em=state.config.emergency||{};
      var box=document.createElement("div"); box.className="scrim";
      box.innerHTML='<div class="sheet"><h2>⛑️ '+t("emergency")+'</h2>'
        +'<div class="notice danger" style="margin-top:8px">⚠️ <div>'+t("fever_warn")+'</div></div>'
        +(em.doctor?'<p><b>'+esc(em.doctor)+'</b></p>':'')
        +(em.phone?'<a class="btn block rose" href="tel:'+esc(em.phone)+'">📞 '+t("call")+' '+esc(em.phone)+'</a>':'<p class="empty">'+(state.config.lang==="ar"?"أضيفا رقم الطبيب في الإعدادات":"Add the doctor's number in Settings")+'</p>')
        +(em.hospital?'<p class="small muted" style="margin-top:8px">🏥 '+esc(em.hospital)+'</p>':'')
        +(em.notes?'<p class="small">'+esc(em.notes)+'</p>':'')
        +'<button class="btn soft block" id="emClose" style="margin-top:12px">'+t("done")+'</button></div>';
      document.body.appendChild(box);
      box.addEventListener("click",function(e){ if(e.target===box) box.remove(); });
      box.querySelector("#emClose").addEventListener("click",function(){ box.remove(); });
    });

    /* ============================ header / tabs ============================ */
    document.getElementById("langBtn").addEventListener("click",function(){ state.config.lang=state.config.lang==="ar"?"en":"ar"; save(); render(); });
    document.getElementById("syncBtn").addEventListener("click",function(){ toast(sync.ok?t("synced"):t("offline")); pull(); });
    document.getElementById("tabs").addEventListener("click",function(e){
      var b=e.target.closest("button[data-tab]"); if(!b) return;
      currentTab=b.getAttribute("data-tab");
      document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x===b);});
      render(); window.scrollTo(0,0);
    });

    /* ============================ onboarding ============================ */
    function onboard(){
      var lang=state.config.lang||"en", role=null, mode="create", code=genCode();
      var box=document.createElement("div"); box.className="scrim"; box.id="onb";
      function draw(){
        box.innerHTML='<div class="sheet">'
          +'<h2>🌿 '+(lang==="ar"?"أهلًا":"Welcome")+'</h2>'
          +'<div class="lead">'+(lang==="ar"?"مساحة لطيفة مشتركة للاعتناء بها يومًا بيوم.":"A gentle, shared space to care for her, day by day.")+'</div>'
          +'<div class="section-label">'+(lang==="ar"?"اللغة":"Language")+'</div>'
          +'<div class="choice"><button class="'+(lang==="ar"?"on":"")+'" data-ol="ar">العربية</button><button class="'+(lang==="en"?"on":"")+'" data-ol="en">English</button></div>'
          +'<div class="section-label">'+(lang==="ar"?"من أنت؟":"Who are you?")+'</div>'
          +'<div class="choice"><button class="'+(role==="nour"?"on":"")+'" data-or="nour">💗 '+(lang==="ar"?"أنا نور":"I'm Nour")+'</button><button class="'+(role==="partner"?"on":"")+'" data-or="partner">🤍 '+(lang==="ar"?"أنا معها":"I'm with her")+'</button></div>'
          +'<div class="section-label">'+(lang==="ar"?"المساحة المشتركة":"Shared space")+'</div>'
          +'<div class="choice"><button class="'+(mode==="create"?"on":"")+'" data-om="create">'+(lang==="ar"?"مساحة جديدة":"Create new")+'</button><button class="'+(mode==="join"?"on":"")+'" data-om="join">'+(lang==="ar"?"الدخول برمز":"Join with code")+'</button></div>'
          +(mode==="create"
            ? '<div class="item center" style="margin-top:10px;font-weight:700;letter-spacing:.1em">'+code+'</div><div class="small muted center">'+(lang==="ar"?"شاركا هذا الرمز بينكما":"Share this code with each other")+'</div>'
            : '<input type="text" id="joinCode" placeholder="'+(lang==="ar"?"أدخل الرمز":"Enter code")+'" style="margin-top:10px;text-align:center;letter-spacing:.1em;text-transform:uppercase">')
          +'<button class="btn block" id="startBtn" style="margin-top:16px" '+(role?'':'disabled style="opacity:.5"')+'>'+(lang==="ar"?"ابدأ":"Start")+'</button>'
          +'<div class="small muted" style="margin-top:12px">'+(lang==="ar"?"هذا التطبيق للمساندة والتنظيم، وليس نصيحة طبية.":"This app is for support and organization, not medical advice.")+'</div>'
          +'</div>';
        box.querySelectorAll("[data-ol]").forEach(function(b){b.onclick=function(){lang=b.getAttribute("data-ol");draw();};});
        box.querySelectorAll("[data-or]").forEach(function(b){b.onclick=function(){role=b.getAttribute("data-or");draw();};});
        box.querySelectorAll("[data-om]").forEach(function(b){b.onclick=function(){mode=b.getAttribute("data-om");draw();};});
        var sb=box.querySelector("#startBtn");
        sb.onclick=function(){
          if(!role) return;
          var finalCode = mode==="create"? code : (box.querySelector("#joinCode").value.trim().toUpperCase());
          if(!finalCode){ return; }
          state.config.lang=lang; state.config.role=role; state.config.spaceCode=finalCode;
          save(); box.remove();
          setSync(false);
          // first sync: pull existing (if joining) then push our local
          pull().then(function(){ pushAll(); });
          render();
          startSyncLoop();
        };
      }
      draw();
      document.body.appendChild(box);
    }

    function startSyncLoop(){
      if(startSyncLoop._on) return; startSyncLoop._on=true;
      setInterval(function(){ if(canSync() && document.visibilityState==="visible") pull(); }, 20000);
      window.addEventListener("focus",function(){ if(canSync()) pull(); });
    }

    /* ============================ boot ============================ */
    render();
    if(!state.config.role || !state.config.spaceCode){
      onboard();
    } else {
      setSync(false);
      pull().then(function(){ pushAll(); });
      startSyncLoop();
    }
  })();
  </script>
</body>
</html>
